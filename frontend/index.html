<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#efede6" />
    <meta name="description" content="YatraShield — real-time incident reporting, triage and response for tourist safety." />
    <title>YatraShield — Safety, tracked to the last minute</title>
    <script>
      // Resolve theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var stored = localStorage.getItem("yatrashield-theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0d0d0b" : "#efede6");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
